# Development Branch CI Workflow
#
# Runs on push to development branch for continuous integration.
# Pull request checks are handled by pr.yml workflow.
#
# Note: E2E smoke tests require preview deployments; to be added in a future story.
# This workflow will be enhanced in S5 (Main Workflow) to include
# deployment to staging and production notifications.
#
# Related Stories:
# - Epic 1A.5.S1: Create PR Workflow with Quality Checks (created pr.yml)
# - Epic 1A.5.S5: Main Workflow (will enhance this file)

name: CI

on:
  push:
    branches: [development]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".vscode/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
