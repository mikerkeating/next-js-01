name: CI

on:
  pull_request:
    branches: [development]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
  push:
    branches: [development]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test || echo "No test script configured yet - skipping"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Get Vercel Preview URL
        id: vercel-preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Vercel deployment..."
          for i in {1..60}; do
            # Get deployments for this SHA, filter for Vercel
            DEPLOYMENT=$(gh api repos/${{ github.repository }}/deployments \
              -q ".[] | select(.creator.login == \"vercel[bot]\" and .sha == \"${{ github.event.pull_request.head.sha }}\") | {id, environment}" \
              2>/dev/null | head -1) || true

            if [ -n "$DEPLOYMENT" ]; then
              DEPLOY_ID=$(echo "$DEPLOYMENT" | jq -r '.id')
              echo "Found deployment: $DEPLOY_ID"

              # Get the deployment status with target_url
              URL=$(gh api repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
                -q '.[0].target_url // empty' 2>/dev/null) || true

              if [ -n "$URL" ]; then
                echo "url=$URL" >> $GITHUB_OUTPUT
                echo "Preview URL: $URL"
                exit 0
              fi
            fi

            echo "Waiting for deployment... (attempt $i/60)"
            sleep 5
          done
          echo "::error::Vercel deployment not found after 5 minutes"
          exit 1

      # Alternative: Run against local build (uncomment if Vercel not configured)
      # - name: Build application
      #   run: pnpm build
      #   env:
      #     NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Playwright smoke tests
        run: pnpm test:e2e:smoke
        env:
          BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
