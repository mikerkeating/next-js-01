# Pull Request Quality Checks Workflow
#
# Runs automated quality checks on every pull request to ensure code quality
# before merging. Jobs run in parallel for faster feedback.
#
# Filtering (S2):
# - Uses Turborepo --filter=[HEAD^1] to run only affected packages
# - Remote caching via Vercel for shared artifacts across CI runs
# - Full runs available via workflow_dispatch or 'ci:full' label
#
# Coverage Reporting (S3):
# - Generates coverage reports during test job using Vitest coverage
# - Posts coverage summary as sticky PR comment (updates on each push)
# - Uploads HTML coverage report as artifact for detailed review
# - Note: Coverage decrease detection planned for future implementation
#
# Triggers: Pull requests to development and main branches, workflow_dispatch
# Jobs: lint, type-check, test (with coverage), security-audit, build, migration-check (all parallel), e2e-smoke (after quality checks)
#
# Related Stories:
# - Epic 1A.5.S1: Create PR Workflow with Quality Checks
# - Epic 1A.5.S2: Configure Turborepo Filtering for CI
# - Epic 1A.5.S3: Add Coverage Reporting to PRs
# - Epic 1A.5.S4: Integrate Preview Deployment and E2E Smoke Tests
# - Epic 1A.5.S7: Set Up Dependabot and Security Scanning
# - Epic 2A.2.S4: Set Up Migration Infrastructure (migration-check job)
#
# Concurrency:
# - Cancels in-progress runs when new commits are pushed to the same PR
# - Prevents wasted CI minutes on superseded commits

name: PR Quality Checks

on:
  pull_request:
    branches:
      - development
      - main
    # Don't skip docs changes - they might affect build or have code examples
  # Allow manual trigger for full CI runs without filtering
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run full CI without filtering (set to true to force full run)"
        required: false
        default: false
        type: boolean

# Cancel in-progress runs on the same PR to save CI minutes
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Permissions required for PR comments and code checkout
permissions:
  contents: read
  pull-requests: write

# Environment variables for Vercel Remote Cache
# TURBO_TOKEN and TURBO_TEAM must be configured as repository secrets
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_CACHE: remote:rw

jobs:
  # Lint job - ESLint code quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 2 required for HEAD^1 comparison in Turborepo filtering
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Determine filter flag
        id: filter
        uses: ./.github/actions/turbo-filter
        with:
          event_name: ${{ github.event_name }}
          full_run: ${{ inputs.full_run }}
          has_full_label: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

      - name: Run ESLint
        run: pnpm turbo run lint ${{ steps.filter.outputs.flag }} --summarize

  # Type check job - TypeScript compilation check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 2 required for HEAD^1 comparison in Turborepo filtering
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Determine filter flag
        id: filter
        uses: ./.github/actions/turbo-filter
        with:
          event_name: ${{ github.event_name }}
          full_run: ${{ inputs.full_run }}
          has_full_label: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

      - name: Run TypeScript type check
        run: pnpm turbo run type-check ${{ steps.filter.outputs.flag }} --summarize

  # Test job - Vitest unit and integration tests with coverage reporting
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 2 required for HEAD^1 comparison in Turborepo filtering
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Determine filter flag
        id: filter
        uses: ./.github/actions/turbo-filter
        with:
          event_name: ${{ github.event_name }}
          full_run: ${{ inputs.full_run }}
          has_full_label: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

      - name: Run tests with coverage
        run: pnpm turbo run test:coverage ${{ steps.filter.outputs.flag }} --summarize

      # Generate coverage summary for PR comment
      # Coverage files are generated in each package's coverage/ directory
      - name: Generate coverage summary
        id: coverage
        if: github.event_name == 'pull_request'
        run: |
          # Aggregate coverage from all packages
          # Look for coverage-summary.json files generated by Vitest
          COVERAGE_FILES=$(find . -name "coverage-summary.json" -not -path "*/node_modules/*" 2>/dev/null || true)

          if [ -z "$COVERAGE_FILES" ]; then
            echo "No coverage files found - tests may not be configured yet"
            echo "has_coverage=false" >> $GITHUB_OUTPUT
            echo "summary=No coverage data available. Configure Vitest coverage in Epic 1A.3." >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_coverage=true" >> $GITHUB_OUTPUT

          # Create coverage summary markdown
          echo "## Test Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "| Package | Statements | Branches | Functions | Lines |" >> coverage-report.md
          echo "|---------|------------|----------|-----------|-------|" >> coverage-report.md

          TOTAL_STATEMENTS=0
          TOTAL_BRANCHES=0
          TOTAL_FUNCTIONS=0
          TOTAL_LINES=0
          PACKAGE_COUNT=0

          for file in $COVERAGE_FILES; do
            # Extract package name from path
            PACKAGE=$(dirname "$file" | sed 's|^\./||' | sed 's|/coverage||')

            # Parse JSON and extract percentages (jq is pre-installed on GitHub runners)
            if command -v jq &> /dev/null; then
              # Helper function to validate numeric values
              validate_numeric() {
                local value="$1"
                local name="$2"
                if [[ "$value" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                  echo "$value"
                else
                  echo "Warning: Non-numeric value '$value' for $name in $file, defaulting to 0" >&2
                  echo "0"
                fi
              }

              # Validate JSON and extract coverage data with error handling
              if ! STATEMENTS_RAW=$(jq -r '.total.statements.pct // 0' "$file" 2>&1); then
                echo "Warning: Failed to parse coverage data in $file: $STATEMENTS_RAW" >&2
                continue
              fi
              STATEMENTS=$(validate_numeric "$STATEMENTS_RAW" "statements")

              if ! BRANCHES_RAW=$(jq -r '.total.branches.pct // 0' "$file" 2>&1); then
                echo "Warning: Failed to parse branches in $file: $BRANCHES_RAW" >&2
                continue
              fi
              BRANCHES=$(validate_numeric "$BRANCHES_RAW" "branches")

              if ! FUNCTIONS_RAW=$(jq -r '.total.functions.pct // 0' "$file" 2>&1); then
                echo "Warning: Failed to parse functions in $file: $FUNCTIONS_RAW" >&2
                continue
              fi
              FUNCTIONS=$(validate_numeric "$FUNCTIONS_RAW" "functions")

              if ! LINES_RAW=$(jq -r '.total.lines.pct // 0' "$file" 2>&1); then
                echo "Warning: Failed to parse lines in $file: $LINES_RAW" >&2
                continue
              fi
              LINES=$(validate_numeric "$LINES_RAW" "lines")

              echo "| $PACKAGE | ${STATEMENTS}% | ${BRANCHES}% | ${FUNCTIONS}% | ${LINES}% |" >> coverage-report.md

              # Accumulate for total (using bc for floating point)
              TOTAL_STATEMENTS=$(echo "$TOTAL_STATEMENTS + $STATEMENTS" | bc)
              TOTAL_BRANCHES=$(echo "$TOTAL_BRANCHES + $BRANCHES" | bc)
              TOTAL_FUNCTIONS=$(echo "$TOTAL_FUNCTIONS + $FUNCTIONS" | bc)
              TOTAL_LINES=$(echo "$TOTAL_LINES + $LINES" | bc)
              PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
            fi
          done

          # Calculate averages if we have packages
          if [ "$PACKAGE_COUNT" -gt 0 ]; then
            AVG_STATEMENTS=$(echo "scale=2; $TOTAL_STATEMENTS / $PACKAGE_COUNT" | bc)
            AVG_BRANCHES=$(echo "scale=2; $TOTAL_BRANCHES / $PACKAGE_COUNT" | bc)
            AVG_FUNCTIONS=$(echo "scale=2; $TOTAL_FUNCTIONS / $PACKAGE_COUNT" | bc)
            AVG_LINES=$(echo "scale=2; $TOTAL_LINES / $PACKAGE_COUNT" | bc)

            echo "" >> coverage-report.md
            echo "**Overall Coverage: ${AVG_LINES}% lines**" >> coverage-report.md

            # Save overall coverage for comparison
            echo "overall_coverage=$AVG_LINES" >> $GITHUB_OUTPUT
          else
            echo "" >> coverage-report.md
            echo "**No packages with coverage data found.**" >> coverage-report.md
            echo "overall_coverage=0" >> $GITHUB_OUTPUT
          fi

          echo "" >> coverage-report.md
          echo "_Generated by CI on $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> coverage-report.md

          # Store report content for comment
          {
            echo "summary<<EOF"
            cat coverage-report.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Post coverage comment to PR (sticky - updates existing comment)
      - name: Post coverage comment
        if: github.event_name == 'pull_request' && steps.coverage.outputs.has_coverage == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: coverage-report
          message: ${{ steps.coverage.outputs.summary }}

      # Upload HTML coverage report as artifact
      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage/html/
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  # Security audit job - Check for vulnerable dependencies
  # Fails on high/critical vulnerabilities to catch security issues early
  # Story: Epic 1A.5.S7
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # Run pnpm audit with high/critical threshold
      # Fails the job if high or critical vulnerabilities are found
      - name: Run security audit
        run: pnpm audit --audit-level=high

      # Report audit results to PR summary
      - name: Report audit results
        if: success()
        run: |
          echo "## Security Audit Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No high or critical vulnerabilities found in dependencies." >> $GITHUB_STEP_SUMMARY

  # Build job - Verify the application builds successfully
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 2 required for HEAD^1 comparison in Turborepo filtering
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Determine filter flag
        id: filter
        uses: ./.github/actions/turbo-filter
        with:
          event_name: ${{ github.event_name }}
          full_run: ${{ inputs.full_run }}
          has_full_label: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

      - name: Build application
        run: pnpm turbo run build ${{ steps.filter.outputs.flag }} --summarize
        env:
          # Provide required build-time environment variables
          # These are placeholder values for CI build validation
          NEXT_PUBLIC_APP_URL: https://example.com

  # Migration validation job - validates database schema and migrations
  # Ensures migration infrastructure is working correctly without requiring
  # a live database connection. Related: Epic 2A.2.S4
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # Build database package to ensure schema compiles
      - name: Build database package
        run: pnpm --filter @repo/database build

      # Validate drizzle configuration and schema
      # Uses drizzle-kit check to validate schema without database connection
      - name: Validate schema configuration
        run: pnpm --filter @repo/database exec drizzle-kit check
        env:
          # Provide placeholder DATABASE_URL for config validation
          # drizzle-kit check validates config without connecting
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      # Verify migrations directory exists and is properly structured
      - name: Check migrations directory
        run: |
          if [ ! -d "packages/database/src/migrations" ]; then
            echo "Error: Migrations directory not found"
            exit 1
          fi
          echo "✓ Migrations directory exists"
          ls -la packages/database/src/migrations/

      # Report success
      - name: Report migration check results
        run: |
          {
            echo "## Migration Check Passed"
            echo ""
            echo "- Database schema compiles successfully"
            echo "- Drizzle configuration is valid"
            echo "- Migrations directory is properly structured"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Database integration tests - validates actual database connections
  # Runs tests against a real PostgreSQL service container.
  # Related: Epic 2A.2.S10
  integration-test:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test] # Run after unit tests pass
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # Build database package first (required for imports)
      - name: Build database package
        run: pnpm --filter @repo/database build

      # Verify database connection before running tests
      - name: Verify database connection
        run: pnpm --filter @repo/database run verify-connection

      # Run integration tests against live PostgreSQL
      - name: Run integration tests
        run: pnpm --filter @repo/database run test:integration

      # Report success
      - name: Report integration test results
        run: |
          {
            echo "## Database Integration Tests Passed"
            echo ""
            echo "- PostgreSQL connection verified"
            echo "- Health check validated"
            echo "- Migration infrastructure tested"
            echo "- Transaction rollback verified"
          } >> "${GITHUB_STEP_SUMMARY}"

  # E2E Smoke Test job - validates preview deployment
  # Runs after all quality checks pass, waits for Vercel preview, then runs smoke tests
  # Story: Epic 1A.5.S4
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, test, security-audit, build, migration-check, integration-test]
    # Only run on pull requests (not workflow_dispatch without PR context)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # Install Playwright browsers for smoke tests
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Wait for Vercel preview deployment using custom action
      # Uses GitHub Deployments API instead of third-party action
      - name: Wait for Vercel Preview
        id: vercel-preview
        uses: ./.github/actions/wait-for-vercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: "300"
          check_interval: "10"

      # Run smoke tests against preview URL
      - name: Run Playwright smoke tests
        run: pnpm test:e2e:smoke
        env:
          BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          CI: true

      # Upload test report on failure
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            testing/e2e/report/
            testing/e2e/results/
          retention-days: 7

      # Upload test traces for debugging failures
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-traces
          path: testing/e2e/results/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
