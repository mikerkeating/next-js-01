# Dependabot Configuration
# Automated dependency updates for npm packages and GitHub Actions
#
# Features:
# - Weekly version updates on Monday 09:00 UTC
# - Security updates handled immediately (separate from version updates)
# - Dependency grouping reduces PR volume (~20/week to ~5/week)
# - Conventional commit format for all PRs
# - Auto-merge for patch updates via dependabot-auto-merge.yml workflow
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Related Stories:
# - Epic 1A.5.S7: Set Up Dependabot and Security Scanning

version: 2

updates:
  # npm ecosystem - Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "development"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    # Rebase strategy ensures PRs stay current with target branch
    rebase-strategy: "auto"

    # Group related dependencies to reduce PR noise
    # See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#groups
    groups:
      # TypeScript and type definitions
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Testing tools (Vitest, Playwright, Testing Library)
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "@testing-library/*"
          - "happy-dom"
          - "msw"
        update-types:
          - "minor"
          - "patch"

      # Linting and formatting tools
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "@typescript-eslint/*"
          - "markdownlint*"
        update-types:
          - "minor"
          - "patch"

      # React ecosystem
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

      # Next.js framework
      nextjs:
        patterns:
          - "next"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"

      # Turborepo and build tools
      build-tools:
        patterns:
          - "turbo"
          - "tsup"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

      # Git hooks and commit tools
      git-hooks:
        patterns:
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
          - "commitlint"
        update-types:
          - "minor"
          - "patch"

      # Validation and schemas
      validation:
        patterns:
          - "zod"
          - "@t3-oss/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions ecosystem
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "development"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    # Group all GitHub Actions together
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
