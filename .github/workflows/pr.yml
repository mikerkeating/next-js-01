# Pull Request Quality Checks Workflow
#
# Runs automated quality checks on every pull request to ensure code quality
# before merging. Jobs run in parallel for faster feedback.
#
# Triggers: Pull requests to development and main branches
# Jobs: lint, type-check, test, build (all parallel)
#
# Related Stories:
# - Epic 1A.5.S1: Create PR Workflow with Quality Checks
#
# Concurrency:
# - Cancels in-progress runs when new commits are pushed to the same PR
# - Prevents wasted CI minutes on superseded commits

name: PR Quality Checks

on:
  pull_request:
    branches:
      - development
      - main
    # Don't skip docs changes - they might affect build or have code examples
    # Can add path filters in S2 (Turborepo filtering)

# Cancel in-progress runs on the same PR to save CI minutes
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Lint job - ESLint code quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

  # Type check job - TypeScript compilation check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: pnpm type-check

  # Test job - Vitest unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  # Build job - Verify the application builds successfully
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build application
        run: pnpm build
        env:
          # Provide required build-time environment variables
          # These are placeholder values for CI build validation
          NEXT_PUBLIC_APP_URL: https://example.com
